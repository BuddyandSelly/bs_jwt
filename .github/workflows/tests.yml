name: RSpec tests

on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-specs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # The suite fails when line or branch coverage drops below 100%,
      # see spec/spec_helper.rb.
      - name: Run tests
        run: bundle exec rspec
