# This is the configuration used to check the rubocop source code.

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'spec/fixtures/**/*'

# Development dependencies are declared in the gemspec, next to the runtime ones.
Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

# The gem is not published to rubygems.org, see the gemspec.
Gemspec/RequireMFA:
  Enabled: false

Lint/SuppressedException:
  Exclude:
    - 'bin/rails'
    - 'bin/rake'
    - 'bin/rspec'

Style/Encoding:
  Enabled: true

Style/NumericLiterals:
  Enabled: false

Style/RescueModifier:
  Enabled: false

# false error when run with Neomake
Naming/FileName:
  Enabled: false

Layout/LineLength:
  Max: 120

Style/RescueStandardError:
  Enabled: false

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - '**/*.rake'
    - 'spec/**/*.rb'
    - 'config/**/*.rb'
    - '*.gemspec'
